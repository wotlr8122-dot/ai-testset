<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="안녕하세요, 프로그램입니다. 나를 소개하는 작은 공간에 오신 것을 환영합니다.">
  <title>프로그램 — 나를 소개합니다</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #f5f4ef; color: #242d28; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; line-height: 1.7; }
    a { color: inherit; }
    .wrap { width: min(1040px, 88%); margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 30px 0; border-bottom: 1px solid #d9ddd5; }
    .logo { font-weight: 800; font-size: 20px; text-decoration: none; letter-spacing: -1px; }
    .logo span { color: #588060; }
    nav a { font-size: 14px; text-decoration: none; border-bottom: 1px solid #858f83; padding-bottom: 4px; }
    main { padding: 85px 0 65px; }
    .hero { display: grid; grid-template-columns: 1.25fr 1fr; gap: 60px; align-items: center; min-height: 400px; }
    .eyebrow { color: #54705a; font-size: 12px; font-weight: 700; letter-spacing: 3px; }
    h1 { font-size: clamp(40px, 6vw, 70px); line-height: 1.25; letter-spacing: -3px; margin: 22px 0; font-weight: 750; }
    h1 span { color: #54705a; }
    .intro { color: #657067; font-size: 17px; margin-bottom: 32px; }
    .button { display: inline-flex; align-items: center; gap: 32px; background: #293e30; color: #fff; padding: 13px 23px; border-radius: 7px; text-decoration: none; font-size: 14px; transition: background .2s; }
    .button:hover { background: #48674d; }
    a:focus-visible { outline: 3px solid #849f62; outline-offset: 6px; }
    .portrait { aspect-ratio: 1; border-radius: 48% 48% 12px 12px; background: #e2e8dc; display: flex; align-items: center; justify-content: center; position: relative; }
    .face { width: 55%; aspect-ratio: 1; background: #f5f4ef; border: 2px solid #54705a; border-radius: 34%; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-7deg); box-shadow: 12px 14px 0 #c3d0bb; }
    .eyes { display: flex; gap: 45px; }
    .eyes i { width: 12px; height: 21px; background: #54705a; border-radius: 8px; }
    .smile { width: 37px; height: 21px; border: solid #54705a; border-width: 0 0 3px; border-radius: 0 0 50% 50%; margin-top: 15px; }
    .hello { position: absolute; bottom: 25px; right: 24px; background: #fafbf7; border: 1px solid #ccd4c5; padding: 6px 16px; border-radius: 30px; font-size: 12px; letter-spacing: 1px; }
    #about { margin-top: 90px; padding-top: 35px; border-top: 1px solid #d9ddd5; display: grid; grid-template-columns: 1fr 2fr; gap: 35px; scroll-margin-top: 30px; }
    h2 { font-size: 24px; margin: 0; letter-spacing: -1px; }
    .about-text { margin: 0; color: #657067; font-size: 17px; }
    footer { padding: 25px 0; border-top: 1px solid #d9ddd5; display: flex; justify-content: space-between; gap: 20px; font-size: 12px; color: #748073; }
    @media (max-width: 650px) { main { padding-top: 45px; } .hero { grid-template-columns: 1fr; gap: 40px; } .portrait { width: min(320px, 90%); justify-self: center; } #about { margin-top: 55px; grid-template-columns: 1fr; gap: 16px; } footer { flex-wrap: wrap; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="logo" href="#">프로그램<span>.</span></a>
      <nav aria-label="주 메뉴"><a href="#about">나의 소개 ↗</a></nav>
    </header>
    <main>
      <section class="hero" aria-labelledby="greeting">
        <div>
          <p class="eyebrow">HELLO, WORLD!</p>
          <h1 id="greeting">안녕하세요,<br><span>프로그램</span>입니다.</h1>
          <p class="intro">나를 소개하는 작은 공간.<br>이곳에 찾아와 주셔서 반가워요.</p>
          <a class="button" href="#about">조금 더 알아보기 <span aria-hidden="true">↓</span></a>
        </div>
        <div class="portrait" role="img" aria-label="미소 짓는 초록색 캐릭터">
          <div class="face"><div class="eyes"><i></i><i></i></div><div class="smile"></div></div>
          <span class="hello" aria-hidden="true">반가워요! ✳</span>
        </div>
      </section>
      <section id="about" aria-labelledby="about-title">
        <h2 id="about-title">저를 소개할게요.</h2>
        <p class="about-text">제 이름은 프로그램입니다.<br>이 페이지는 저를 소개하는 첫 번째 인사예요.<br>앞으로 이곳에 저만의 이야기를 하나씩 채워 나가려고 해요.</p>
      </section>
    </main>
    <footer><span>© 프로그램</span><span>작은 소개에서 시작되는 이야기.</span></footer>
  </div>
</body>
</html>
